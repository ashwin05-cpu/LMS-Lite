server.port=8080

# Spring Application Name
spring.application.name=lms-lite-backend

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:lmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Multipart Upload Limits (for multimedia documents/videos)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Configuration (Secret minimum 256 bits for HS256)
app.jwt.secret=9a67b61f887b469a9b23b1285e6834b92864a78129034e34ab68c91d4e284a1e948cf
app.jwt.expiration-student-ms=28800000
app.jwt.expiration-instructor-ms=43200000
app.jwt.expiration-admin-ms=21600000
app.jwt.refresh-expiration-ms=604800000

# Logging
logging.level.com.lmslite=INFO
logging.level.org.springframework.security=WARN
